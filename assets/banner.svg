<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="100%" height="100%">
  <defs>
    <!-- Background & Depth Gradients -->
    <radialGradient id="bg-space" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#090E1A" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="shield-core-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="text-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Isometric Cyber Grid Pattern -->
    <pattern id="iso-grid" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 L 30 34.64 L 0 17.32 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="30" cy="17.32" r="1" fill="#38BDF8" fill-opacity="0.35"/>
    </pattern>

    <!-- Laser & Shield Gradients -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shield-3d-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="shield-3d-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Metallic Brand Wordmark Gradient -->
    <linearGradient id="text-metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#93C5FD"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="brand-linear-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- 3D Tech Chip Gradients -->
    <linearGradient id="chip-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="chip-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Logo Brand Vector Gradients -->
    <linearGradient id="logo-g-left" gradientUnits="userSpaceOnUse" x1="88.87" y1="375.44" x2="346.44" y2="91.4">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="logo-g-loop" gradientUnits="userSpaceOnUse" x1="346.99" y1="308.74" x2="275.32" y2="461.14">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="logo-g-right" gradientUnits="userSpaceOnUse" x1="409.76" y1="158.83" x2="310.79" y2="276.5">
      <stop offset="0%" stop-color="#3124B3"/>
      <stop offset="100%" stop-color="#443FFF"/>
    </linearGradient>

    <!-- Clip Path for Shield Laser Scan -->
    <clipPath id="shield-clip">
      <path d="M 0 -130 L 125 -60 L 125 45 C 125 130 0 180 0 180 C 0 180 -125 130 -125 45 L -125 -60 Z"/>
    </clipPath>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes floatShield {
        0%, 100% { transform: translate(640px, 172px) translateY(0px) scale(1); }
        50% { transform: translate(640px, 172px) translateY(-8px) scale(1.015); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-160px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(200px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.1); }
      }
      @keyframes circuitStream1 {
        0% { stroke-dashoffset: 200; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes circuitStream2 {
        0% { stroke-dashoffset: 0; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 200; opacity: 0.2; }
      }
      @keyframes particleFloat1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0; }
        20% { opacity: 0.85; }
        80% { opacity: 0.85; }
        100% { transform: translateY(-80px) translateX(15px); opacity: 0; }
      }
      @keyframes particleFloat2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateY(-90px) translateX(-20px); opacity: 0; }
      }
      @keyframes chipHover {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.9); }
      }
      @keyframes gridPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .anim-shield { animation: floatShield 5s ease-in-out infinite; }
      .anim-scan { animation: scanBeam 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .anim-circuit1 { stroke-dasharray: 20, 40; animation: circuitStream1 3s linear infinite; }
      .anim-circuit2 { stroke-dasharray: 20, 40; animation: circuitStream2 3.5s linear infinite; }
      .anim-part1 { animation: particleFloat1 4.5s ease-in-out infinite; }
      .anim-part2 { animation: particleFloat2 5.2s ease-in-out infinite 1s; }
      .anim-part3 { animation: particleFloat1 4.8s ease-in-out infinite 2s; }
      .anim-part4 { animation: particleFloat2 5.5s ease-in-out infinite 2.5s; }
      .anim-chip-l1 { animation: chipHover 6s ease-in-out infinite; }
      .anim-chip-l2 { animation: chipHover 6.5s ease-in-out infinite 1s; }
      .anim-chip-r1 { animation: chipHover 6s ease-in-out infinite 0.5s; }
      .anim-chip-r2 { animation: chipHover 6.5s ease-in-out infinite 1.5s; }
      .anim-status-dot { animation: statusBlink 1.8s ease-in-out infinite; }
      .anim-grid { animation: gridPulse 6s ease-in-out infinite; }
      .anim-orbit { animation: orbitSpin 25s linear infinite; transform-origin: 640px 172px; }

      @media (prefers-reduced-motion: reduce) {
        .anim-shield, .anim-scan, .anim-glow, .anim-circuit1, .anim-circuit2,
        .anim-part1, .anim-part2, .anim-part3, .anim-part4,
        .anim-chip-l1, .anim-chip-l2, .anim-chip-r1, .anim-chip-r2,
        .anim-status-dot, .anim-grid, .anim-orbit {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="580" fill="#020408"/>
  <rect width="1280" height="580" fill="url(#bg-space)"/>

  <!-- 3D Perspective Isometric Grid Plane -->
  <g class="anim-grid" transform="translate(0, 75) scale(1, 0.72)">
    <rect width="1280" height="550" fill="url(#iso-grid)" opacity="0.6"/>
  </g>

  <!-- Ambient Hologram Glow Behind Shield -->
  <circle cx="640" cy="172" r="300" fill="url(#shield-core-glow)" class="anim-glow"/>
  <ellipse cx="640" cy="415" rx="360" ry="80" fill="url(#text-glow)"/>

  <!-- Orbital Cyber Rings Around Shield -->
  <g class="anim-orbit" opacity="0.4">
    <ellipse cx="640" cy="172" rx="180" ry="85" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8, 14"/>
    <ellipse cx="640" cy="172" rx="210" ry="100" fill="none" stroke="#6366F1" stroke-width="0.9" stroke-dasharray="12, 24"/>
  </g>

  <!-- Circuit Stream Pathways Left & Right -->
  <g stroke="#38BDF8" stroke-width="1.6" fill="none" opacity="0.8">
    <!-- Left Top Trace -->
    <path d="M 230 105 L 380 105 L 460 155 L 510 155" stroke="#1E293B"/>
    <path d="M 230 105 L 380 105 L 460 155 L 510 155" class="anim-circuit1" stroke="#22D3EE"/>

    <!-- Left Bottom Trace -->
    <path d="M 230 235 L 360 235 L 440 185 L 510 185" stroke="#1E293B"/>
    <path d="M 230 235 L 360 235 L 440 185 L 510 185" class="anim-circuit2" stroke="#38BDF8"/>

    <!-- Right Top Trace -->
    <path d="M 1050 105 L 900 105 L 820 155 L 770 155" stroke="#1E293B"/>
    <path d="M 1050 105 L 900 105 L 820 155 L 770 155" class="anim-circuit1" stroke="#67E8F9"/>

    <!-- Right Bottom Trace -->
    <path d="M 1050 235 L 920 235 L 840 185 L 770 185" stroke="#1E293B"/>
    <path d="M 1050 235 L 920 235 L 840 185 L 770 185" class="anim-circuit2" stroke="#818CF8"/>
  </g>

  <!-- 3D Floating Architecture Tech Chips -->
  <!-- Chip 1: Top Left - Native DNR Engine -->
  <g class="anim-chip-l1" transform="translate(110, 85)">
    <path d="M 0 10 L 220 10 L 220 52 L 0 52 Z" fill="#030712" opacity="0.85"/>
    <path d="M 0 0 L 220 0 L 220 42 L 0 42 Z" fill="url(#chip-top)" stroke="url(#chip-stroke)" stroke-width="1.3" rx="9"/>
    <circle cx="18" cy="21" r="3.5" fill="#38BDF8" class="anim-status-dot"/>
    <text x="32" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#F8FAFC">// NATIVE_DNR</text>
    <text x="145" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#38BDF8">[C++ CORE]</text>
  </g>

  <!-- Chip 2: Bottom Left - 100% Local-First -->
  <g class="anim-chip-l2" transform="translate(110, 215)">
    <path d="M 0 10 L 220 10 L 220 52 L 0 52 Z" fill="#030712" opacity="0.85"/>
    <path d="M 0 0 L 220 0 L 220 42 L 0 42 Z" fill="url(#chip-top)" stroke="url(#chip-stroke)" stroke-width="1.3" rx="9"/>
    <circle cx="18" cy="21" r="3.5" fill="#10B981" class="anim-status-dot"/>
    <text x="32" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#F8FAFC">// LOCAL_FIRST</text>
    <text x="142" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#10B981">[0-CLOUD]</text>
  </g>

  <!-- Chip 3: Top Right - Threat Heuristics -->
  <g class="anim-chip-r1" transform="translate(950, 85)">
    <path d="M 0 10 L 220 10 L 220 52 L 0 52 Z" fill="#030712" opacity="0.85"/>
    <path d="M 0 0 L 220 0 L 220 42 L 0 42 Z" fill="url(#chip-top)" stroke="url(#chip-stroke)" stroke-width="1.3" rx="9"/>
    <circle cx="18" cy="21" r="3.5" fill="#F59E0B" class="anim-status-dot"/>
    <text x="32" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#F8FAFC">// THREAT_GUARD</text>
    <text x="156" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#F59E0B">[TIER-1]</text>
  </g>

  <!-- Chip 4: Bottom Right - AES-GCM-256 Vault -->
  <g class="anim-chip-r2" transform="translate(950, 215)">
    <path d="M 0 10 L 220 10 L 220 52 L 0 52 Z" fill="#030712" opacity="0.85"/>
    <path d="M 0 0 L 220 0 L 220 42 L 0 42 Z" fill="url(#chip-top)" stroke="url(#chip-stroke)" stroke-width="1.3" rx="9"/>
    <circle cx="18" cy="21" r="3.5" fill="#818CF8" class="anim-status-dot"/>
    <text x="32" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#F8FAFC">// CRYPTO_VAULT</text>
    <text x="158" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#818CF8">[600k]</text>
  </g>

  <!-- Floating Telemetry Particles -->
  <g>
    <circle cx="520" cy="135" r="2.5" fill="#67E8F9" class="anim-part1"/>
    <circle cx="760" cy="115" r="3" fill="#38BDF8" class="anim-part2"/>
    <circle cx="490" cy="215" r="2" fill="#818CF8" class="anim-part3"/>
    <circle cx="790" cy="205" r="2.5" fill="#34D399" class="anim-part4"/>
  </g>

  <!-- Central 3D Animated Holographic Shield -->
  <g class="anim-shield">
    <!-- Rear Shadow & Extrusion -->
    <path d="M 0 -125 L 130 -52 L 130 52 C 130 140 0 190 0 190 C 0 190 -130 140 -130 52 L -130 -52 Z"
          fill="#0B1120" stroke="#1E1B4B" stroke-width="3" opacity="0.95"/>

    <!-- Front Face Shield -->
    <path d="M 0 -130 L 125 -60 L 125 45 C 125 130 0 180 0 180 C 0 180 -125 130 -125 45 L -125 -60 Z"
          fill="url(#shield-3d-front)" stroke="url(#shield-3d-stroke)" stroke-width="2.5"/>

    <!-- Inner Shield Dashed Inset -->
    <path d="M 0 -108 L 100 -50 L 100 35 C 100 102 0 145 0 145 C 0 145 -100 102 -100 35 L -100 -50 Z"
          fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.65" stroke-dasharray="8,5"/>

    <!-- Animated Laser Scanning Beam -->
    <g clip-path="url(#shield-clip)">
      <rect x="-140" y="0" width="280" height="28" fill="url(#laser-grad)" class="anim-scan"/>
    </g>

    <!-- Embedded Authentic AUVYQ Brand Vector Mark -->
    <g transform="scale(0.24) translate(-256, -256)">
      <path d="M 231.87 455.02 C 220.06 453.13, 207.25 451.11, 195.75 447.73 C 143.87 432.21, 100.35 396.6, 74.88 348.82 C 51.31 305.37, 46 249.33, 60.15 202.06 C 75.78 149.84, 113.58 105.69, 161.39 80.03 C 209.95 53.87, 266.93 48.13, 319.73 64.1 C 326.58 66.03, 330.39 66.47, 320.38 67.93 C 274.32 76.23, 263.69 96.41, 241.57 133.2 L 209.3 187.49 L 176.24 242.77 C 166.28 259.47, 156.58 273.87, 150.28 292.4 C 125.24 366.14, 165.35 421.5, 234.27 444.39 L 231.87 455.02 Z" fill="url(#logo-g-left)"/>
      <path d="M 319.73 64.1 C 326.58 66.03, 330.39 66.47, 320.38 67.93 C 318.17 66.93, 317.93 65.77, 319.73 64.1 Z" fill="#5656D8"/>
      <path d="M 262.96 285.28 C 276.71 284.95, 290.44 286.49, 303.78 289.87 C 339.49 298.89, 371.11 319.72, 393.48 348.97 C 403.78 362.48, 413.5 379.35, 422.47 393.94 C 434.85 414.06, 447.5 434, 459.6 454.27 L 298.96 454.35 C 300.79 451.56, 302.47 448.41, 304.12 445.49 C 309.47 434.08, 310.36 423.87, 306.2 411.79 C 302.31 400.61, 294.12 391.45, 283.44 386.34 C 249.51 369.93, 204.82 398.36, 219.27 436.72 C 207.99 431.2, 197.5 424.19, 188.07 415.9 C 170.52 400.33, 157.22 381.32, 156.19 357.29 C 155.81 348.63, 156.56 332.69, 162.88 326.06 C 166.4 322.37, 171.52 318.38, 175.56 315.18 C 200.91 295.09, 231.05 286.38, 262.96 285.28 Z" fill="url(#logo-g-loop)"/>
      <path d="M 357.03 80.37 C 358.08 79.25, 358.79 78.65, 359.95 77.65 C 362.88 77.55, 362.75 78.07, 365.54 79.7 C 411.87 108.29, 444.9 154.16, 457.34 207.17 C 460.56 221.27, 466 266.07, 460.57 278.25 C 458.02 278.61, 458.03 278.1, 455.23 277 C 451.81 310.84, 436.32 341.65, 417.08 369 C 403.14 347.68, 389.73 323.31, 376.18 301.55 C 338.32 240.79, 301.79 178.62, 263.8 118 C 271.63 103.56, 283.75 93.54, 298.55 86.71 C 310.01 79.16, 344.24 75.4, 357.03 80.37 Z" fill="url(#logo-g-right)"/>
      <path d="M 357.03 80.37 C 358.08 79.25, 358.79 78.65, 359.95 77.65 C 362.88 77.55, 362.75 78.07, 365.54 79.7 C 411.87 108.29, 444.9 154.16, 457.34 207.17 C 460.56 221.27, 466 266.07, 460.57 278.25 C 458.02 278.61, 458.03 278.1, 455.23 277 C 457.93 247.44, 455.39 206.16, 441.69 179.48 C 441.52 176.22, 435.68 164.95, 433.86 161.41 C 417.05 128.7, 392.93 104.41, 362.46 84.36 C 360 82.9, 359.24 82.24, 357.03 80.37 Z" fill="#1DF8FD"/>
      <circle cx="258" cy="453" r="10" fill="#38BDF8"/>
    </g>
  </g>

  <!-- Center Typography & Brand Information -->
  <!-- Top Terminal Status Bar -->
  <g transform="translate(640, 352)" text-anchor="middle">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#0B1120" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="-185" cy="0" r="3.5" fill="#10B981" class="anim-status-dot"/>
    <text x="12" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="1">
      PROTOCOL: <tspan fill="#38BDF8">ACTIVE</tspan> | CORE: <tspan fill="#67E8F9">100% LOCAL-FIRST</tspan> | MV3: <tspan fill="#34D399">CHROME 120+</tspan>
    </text>
  </g>

  <!-- Main 3D Wordmark -->
  <text x="640" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="900" font-size="56" letter-spacing="9" fill="url(#text-metallic)">AUVYQ</text>

  <!-- Subtitle -->
  <text x="640" y="456" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="700" font-size="15" letter-spacing="3.5" fill="url(#brand-linear-text)">LOCAL-FIRST PRIVACY SHIELD &amp; AUTONOMOUS WEB DEFENSE</text>

  <!-- Description / Feature List -->
  <text x="640" y="486" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="500" font-size="14.5" fill="#94A3B8" letter-spacing="0.4">
    Wire-Speed Ad Blocking • Heuristic Phishing Guard • Smart Cookie Isolation • Zero Cloud Telemetry
  </text>

  <!-- Bottom Developer Telemetry Indicators -->
  <g transform="translate(640, 532)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <!-- Stat 1 -->
    <g transform="translate(-405, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="7" fill="#0B1120" stroke="#1E293B" stroke-width="1.1"/>
      <text x="0" y="4" text-anchor="middle" fill="#CBD5E1">⚡ Latency: <tspan fill="#38BDF8" font-weight="700">0ms (C++)</tspan></text>
    </g>
    <!-- Stat 2 -->
    <g transform="translate(-135, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="7" fill="#0B1120" stroke="#1E293B" stroke-width="1.1"/>
      <text x="0" y="4" text-anchor="middle" fill="#CBD5E1">🛡️ Rules: <tspan fill="#34D399" font-weight="700">159 Native DNR</tspan></text>
    </g>
    <!-- Stat 3 -->
    <g transform="translate(135, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="7" fill="#0B1120" stroke="#1E293B" stroke-width="1.1"/>
      <text x="0" y="4" text-anchor="middle" fill="#CBD5E1">🔒 Vault: <tspan fill="#818CF8" font-weight="700">AES-GCM (600k)</tspan></text>
    </g>
    <!-- Stat 4 -->
    <g transform="translate(405, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="7" fill="#0B1120" stroke="#1E293B" stroke-width="1.1"/>
      <text x="0" y="4" text-anchor="middle" fill="#CBD5E1">🧪 Tests: <tspan fill="#60A5FA" font-weight="700">118 Passing</tspan></text>
    </g>
  </g>

  <!-- Bottom Cyber Glow Trim Line -->
  <line x1="200" y1="578" x2="1080" y2="578" stroke="url(#shield-3d-stroke)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
